<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chat</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075e54">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Name screen -->
<div id="nameScreen" class="screen hidden">
  <div class="name-box">
    <div class="logo-circle">💬</div>
    <h2>Welcome</h2>
    <p>Apna naam daalo</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="20">
    <button id="nameBtn">Start</button>
  </div>
</div>

<!-- Users list -->
<div id="usersScreen" class="screen hidden">
  <header class="topbar">
    <div class="avatar" id="myAvatar">?</div>
    <div class="top-info">
      <h3>Chats</h3>
      <span>Kisi user pe tap karo DM ke liye</span>
    </div>
  </header>
  <main id="usersList" class="users-list"></main>
</div>

<!-- Chat screen -->
<div id="chatScreen" class="screen hidden">
  <header class="topbar">
    <button id="backBtn" class="back-btn">←</button>
    <div class="avatar" id="otherAvatar">?</div>
        <div class="top-info">
      <h3 id="otherName">...</h3>
      <span id="typingStatus">online</span>
    </div>
  </header>
  <main id="messages"></main>
  <form id="form" class="inputbar">
    <input id="input" type="text" placeholder="Message" autocomplete="off">
    <button type="submit" aria-label="Send">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z" fill="#fff"/></svg>
</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
